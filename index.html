<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAT — Communication Assessment Tool</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>CAT</h1>
    <p class="app-subtitle">Communication Assessment Tool</p>
  </header>

  <main id="app">
    <section id="patient-section" class="app-section">
      <h2>Patients</h2>
      <p class="placeholder-note">The patient list (select existing / start new) will appear here.</p>
    </section>

    <section id="checklist-section" class="app-section" hidden>
      <h2>Checklist</h2>
      <p class="placeholder-note">The communication checklist will appear here.</p>
    </section>

    <section id="report-section" class="app-section" hidden>
      <h2>Report</h2>
      <p class="placeholder-note">The clinical and caregiver report will appear here.</p>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
